name: llms.txt check
on:
  pull_request:
    branches:
      - main
jobs:
  check-llms-txt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up environment
        run: uv sync

      - name: Run llms.txt generator
        run: uv run python scripts/llms_txt --base-url https://docs.example.com

      - name: Fail if llms.txt files are out of date
        run: |
          git diff --exit-code || {
            echo ""
            echo "llms.txt files are out of date."
            echo "Run the generator locally and commit the result:"
            echo ""
            echo "  python3 scripts/llms_txt --base-url https://docs.example.com"
            echo ""
            exit 1
          }
